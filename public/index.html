<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0e13" />
    <meta name="description" content="Search movies, browse trending films, filter by genre, year and rating, and save your favorites. Powered by TMDB." />
    <meta property="og:title" content="Movie Explorer" />
    <meta property="og:description" content="Discover trending movies and build your favorites list." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Movie Explorer – Discover Your Favorite Films</title>
    <!-- Sets the theme class BEFORE first paint, so dark-mode users never see a white flash. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('movie-explorer:v1'));
        var m = s && s.ui && s.ui.mode;
        if (m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Movie Explorer.</noscript>
    <div id="root"></div>
  </body>
</html>
